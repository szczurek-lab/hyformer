[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "Hyformer"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26,<2.0",
    "pandas==1.5.3",
    "rdkit==2023.9.2",
    "scipy==1.10.1",
    "scikit-learn",
    "tqdm",
    "transformers<4.46.0",
    "wandb",
    "torch==2.2.2",
    "torchvision==0.17.2",
    "torchaudio==2.2.2",
    "deepchem==2.8.0",
    "guacamol==0.5.5",
    "fcd==1.2",
]

[tool.setuptools.package-data]
"hyformer.utils.properties.smiles.molbert" = ["physchem_distributions.json"]

[tool.uv]
required-environments = [
    "sys_platform == 'linux'",
    "sys_platform == 'win32'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[[tool.uv.index]]
name = "pytorch-cu118"
url = "https://download.pytorch.org/whl/cu118"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu118", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cu118", marker = "sys_platform != 'darwin'" },
]
torchaudio = [
    { index = "pytorch-cu118", marker = "sys_platform != 'darwin'" },
]
